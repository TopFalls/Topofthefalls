# Supabase project config for Carl's Top of the Falls instance.
# Pushed to the linked cloud project with: npx supabase config push
# Only the sections declared here are diffed/pushed.

project_id = "dpbgdisezxlttwrxqanu"

[auth]
site_url = "https://topofthefalls.vercel.app"
additional_redirect_urls = [
  "https://topofthefalls.vercel.app",
  "https://topofthefalls.vercel.app/**",
  "http://localhost:5173",
  "http://localhost:4173",
]

[auth.rate_limit]
# Custom SMTP defaults to 30 new users/hour, which a single Facebook
# announcement to a 117-player roster would blow straight through.
email_sent = 100

[auth.email]
enable_signup = true
enable_confirmations = false
# Members sign in with a 6-digit emailed code (no password, no link).
otp_length = 6
otp_expiry = 3600
# Minimum gap between sign-in emails to the SAME address. Declared explicitly
# because the CLI otherwise materializes its own default of 1s, which lets one
# player mashing "Send Sign-In Code" burn the project-wide hourly email quota
# for the whole league. 60s matches the Supabase platform default.
max_frequency = "60s"

# Custom SMTP (Resend). Required, not optional: on the built-in email provider
# Supabase rejects template modification with a 400, so players would receive a
# stock magic-LINK email with no {{ .Token }} while the app asks for a 6-digit
# code — and the built-in sender's hourly cap cannot be raised.
#
# The API key is read from the RESEND_API_KEY environment variable and is never
# committed. Set it with: setx RESEND_API_KEY "re_..."
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "onboarding@resend.dev"
sender_name = "Top of the Falls"

# Sign-in code email: show the 6-digit token instead of a magic link.
[auth.email.template.magic_link]
subject = "Your Top of the Falls sign-in code"
content_path = "./supabase/templates/magic_link.html"

# Invite email (used when an admin invites a player by email).
[auth.email.template.invite]
subject = "You're invited to Top of the Falls"
content_path = "./supabase/templates/invite.html"
